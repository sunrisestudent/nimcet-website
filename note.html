<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIMCET PrepPro | Note Editor</title>

<style>
/* =========================================================
   NIMCET PREPPRO NOTE EDITOR
   Professional Word / Docs inspired workspace
========================================================= */

:root{
    --bg:#070b14;
    --bg2:#0a1020;
    --panel:#0d1424;
    --panel2:#111a2d;
    --panel3:#151f35;
    --page:#ffffff;
    --pageText:#172033;

    --border:rgba(255,255,255,.08);
    --border2:rgba(255,255,255,.13);

    --primary:#6366f1;
    --primary2:#7c3aed;
    --cyan:#22d3ee;
    --green:#34d399;
    --yellow:#fbbf24;
    --red:#fb7185;

    --text:#f8fafc;
    --muted:#94a3b8;
    --muted2:#64748b;

    --sidebar:260px;
    --toolbar:58px;
    --topbar:48px;

    --shadow:0 25px 80px rgba(0,0,0,.35);
}

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(99,102,241,.13),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(34,211,238,.07),
            transparent 25%
        ),
        var(--bg);

    color:var(--text);
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}


/* =========================================================
   TOP HEADER
========================================================= */

.topbar{
    height:var(--topbar);
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    background:
        rgba(7,11,20,.96);

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(20px);

    z-index:1000;
}

.brand-area{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:240px;
}

.logo{
    width:29px;
    height:29px;

    display:grid;
    place-items:center;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    font-size:12px;
    font-weight:900;

    box-shadow:
        0 8px 20px rgba(99,102,241,.25);
}

.brand-text{
    font-size:12px;
    font-weight:800;
}

.brand-text span{
    color:#818cf8;
}

.note-name-area{
    display:flex;
    align-items:center;
    gap:8px;

    max-width:420px;
}

.note-name{
    min-width:120px;
    max-width:300px;

    border:0;
    outline:0;

    background:transparent;
    color:#e2e8f0;

    font-size:12px;
    font-weight:700;

    padding:5px 7px;
    border-radius:6px;
}

.note-name:hover,
.note-name:focus{
    background:rgba(255,255,255,.05);
}

.save-status{
    display:flex;
    align-items:center;
    gap:5px;

    color:#64748b;
    font-size:9px;
}

.save-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#64748b;
}

.save-status.saved .save-dot{
    background:var(--green);
}

.save-status.saving .save-dot{
    background:var(--yellow);
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        opacity:.3;
    }
}

.top-actions{
    display:flex;
    align-items:center;
    gap:5px;
}

.top-btn{
    min-width:31px;
    height:31px;

    display:grid;
    place-items:center;

    padding:0 8px;

    border:1px solid transparent;
    border-radius:7px;

    background:transparent;
    color:#94a3b8;

    font-size:12px;
}

.top-btn:hover{
    background:rgba(255,255,255,.06);
    color:white;
}

.top-btn.primary{
    background:
        linear-gradient(
            100deg,
            #4f46e5,
            #7c3aed
        );

    color:white;
}

.top-btn.danger:hover{
    color:#fb7185;
}

.avatar{
    width:30px;
    height:30px;

    display:grid;
    place-items:center;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );

    color:white;
    font-size:9px;
    font-weight:800;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
    flex:1;
    min-height:0;

    display:flex;
}


/* =========================================================
   LEFT SIDEBAR
========================================================= */

.sidebar{
    position:relative;

    width:var(--sidebar);
    flex-shrink:0;

    display:flex;
    flex-direction:column;

    background:
        rgba(9,14,27,.97);

    border-right:1px solid var(--border);

    transition:
        width .25s ease,
        transform .25s ease;

    z-index:500;
}

.sidebar.collapsed{
    width:0;
    overflow:hidden;
}

.sidebar-head{
    height:48px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    border-bottom:1px solid var(--border);
}

.sidebar-title{
    font-size:10px;
    font-weight:800;
    color:#cbd5e1;
    letter-spacing:.5px;
    text-transform:uppercase;
}

.sidebar-content{
    flex:1;
    overflow:auto;
    padding:12px;
}

.sidebar-section{
    margin-bottom:20px;
}

.sidebar-section-title{
    margin-bottom:8px;

    color:#475569;

    font-size:8px;
    font-weight:800;

    letter-spacing:1px;
    text-transform:uppercase;
}

.context-card{
    padding:11px;

    border:1px solid var(--border);
    border-radius:11px;

    background:
        rgba(255,255,255,.025);
}

.context-row{
    display:flex;
    align-items:center;
    gap:8px;

    padding:6px 0;

    color:#94a3b8;
    font-size:9px;
}

.context-icon{
    width:24px;
    height:24px;

    display:grid;
    place-items:center;

    border-radius:6px;

    background:rgba(99,102,241,.08);
    color:#a5b4fc;
}

.context-value{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    color:#e2e8f0;
}

.outline-item{
    display:flex;
    align-items:center;

    gap:8px;

    padding:7px 8px;

    border-radius:7px;

    color:#94a3b8;

    font-size:9px;

    cursor:pointer;
}

.outline-item:hover{
    background:rgba(255,255,255,.04);
    color:white;
}

.outline-item.h1{
    color:#e2e8f0;
    font-weight:700;
}

.outline-item.h2{
    padding-left:18px;
}

.outline-item.h3{
    padding-left:28px;
}

.study-tools{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.study-tool{
    min-height:52px;

    padding:8px;

    border:1px solid var(--border);
    border-radius:9px;

    background:
        rgba(255,255,255,.025);

    color:#94a3b8;

    text-align:left;

    font-size:8px;
}

.study-tool:hover{
    border-color:rgba(129,140,248,.25);
    background:rgba(99,102,241,.06);
    color:white;
}

.study-tool strong{
    display:block;
    margin-bottom:3px;

    color:#cbd5e1;
    font-size:9px;
}


/* =========================================================
   MAIN EDITOR
========================================================= */

.editor-area{
    flex:1;
    min-width:0;

    display:flex;
    flex-direction:column;

    background:
        #101827;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    min-height:var(--toolbar);
    flex-shrink:0;

    display:flex;
    align-items:center;
    gap:4px;

    padding:6px 10px;

    background:
        rgba(13,20,36,.98);

    border-bottom:1px solid var(--border);

    overflow-x:auto;
    overflow-y:hidden;

    scrollbar-width:thin;

    z-index:400;
}

.toolbar::-webkit-scrollbar{
    height:4px;
}

.toolbar::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}

.tool-group{
    display:flex;
    align-items:center;
    gap:3px;

    padding-right:6px;
    margin-right:3px;

    border-right:1px solid var(--border);
}

.tool-group:last-child{
    border-right:0;
}

.tool{
    min-width:29px;
    height:30px;

    display:grid;
    place-items:center;

    padding:0 7px;

    border:1px solid transparent;
    border-radius:6px;

    background:transparent;
    color:#94a3b8;

    font-size:11px;
}

.tool:hover{
    background:rgba(255,255,255,.06);
    color:white;
}

.tool.active{
    color:#c7d2fe;
    background:rgba(99,102,241,.16);
    border-color:rgba(99,102,241,.2);
}

.tool-label{
    font-size:10px;
}

.toolbar-select{
    height:30px;

    padding:0 8px;

    border:1px solid var(--border);
    border-radius:6px;

    outline:none;

    background:#0a1120;
    color:#cbd5e1;

    font-size:9px;
}

.toolbar-select:focus{
    border-color:#6366f1;
}

.color-tool{
    position:relative;
}

.color-tool input{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
}


/* =========================================================
   CANVAS AREA
========================================================= */

.canvas-area{
    flex:1;
    min-height:0;

    position:relative;

    overflow:auto;

    padding:45px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(99,102,241,.04),
            transparent 35%
        ),
        #111827;
}

.canvas-inner{
    width:max-content;
    min-width:100%;
    min-height:100%;

    display:flex;
    justify-content:center;

    padding-bottom:80px;
}


/* =========================================================
   DOCUMENT PAGE
========================================================= */

.page{
    position:relative;

    width:900px;
    min-height:1165px;

    padding:72px 76px;

    background:var(--page);
    color:var(--pageText);

    box-shadow:
        0 25px 80px rgba(0,0,0,.4);

    transform-origin:top center;

    transition:transform .15s ease;
}

.page::before{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    border:1px solid rgba(15,23,42,.06);
}


/* =========================================================
   DOCUMENT EDITOR
========================================================= */

.document-editor{
    position:relative;

    min-height:1020px;

    outline:none;

    color:#172033;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:15px;

    line-height:1.7;

    word-break:break-word;
}

.document-editor:empty::before{
    content:
        "Start writing your NIMCET notes here...";

    color:#a8b0bf;

    pointer-events:none;
}

.document-editor h1{
    font-size:32px;
    line-height:1.2;
    margin:0 0 15px;
}

.document-editor h2{
    font-size:25px;
    line-height:1.3;
    margin:20px 0 10px;
}

.document-editor h3{
    font-size:20px;
    line-height:1.35;
    margin:18px 0 8px;
}

.document-editor h4{
    font-size:17px;
    margin:15px 0 7px;
}

.document-editor p{
    margin:0 0 9px;
}

.document-editor blockquote{
    margin:15px 0;
    padding:13px 17px;

    border-left:4px solid #6366f1;

    background:#f1f5ff;
    color:#475569;

    border-radius:0 8px 8px 0;
}

.document-editor pre{
    margin:15px 0;
    padding:15px;

    border-radius:9px;

    background:#111827;
    color:#e2e8f0;

    overflow:auto;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:12px;
}

.document-editor table{
    width:100%;

    border-collapse:collapse;

    margin:15px 0;
}

.document-editor th,
.document-editor td{
    border:1px solid #cbd5e1;
    padding:8px 10px;
    min-width:70px;
}

.document-editor th{
    background:#eef2ff;
}

.document-editor a{
    color:#4f46e5;
    text-decoration:underline;
}


/* =========================================================
   FLOATING OBJECT SYSTEM
========================================================= */

.object-layer{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:20;
}

.editor-object{
    position:absolute;

    pointer-events:auto;

    user-select:none;

    cursor:move;

    outline:2px solid transparent;

    outline-offset:2px;
}

.editor-object.selected{
    outline:2px solid #6366f1;
}

.object-content{
    width:100%;
    height:100%;

    overflow:hidden;
}


/* IMAGE */

.image-object img{
    width:100%;
    height:100%;

    display:block;

    object-fit:contain;

    pointer-events:none;

    user-select:none;
}


/* SHAPES */

.shape-object{
    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:13px;
    font-weight:700;

    text-align:center;

    overflow:hidden;
}

.shape-rectangle{
    background:#6366f1;
}

.shape-rounded{
    background:#8b5cf6;
    border-radius:18px;
}

.shape-circle{
    background:#06b6d4;
    border-radius:50%;
}

.shape-ellipse{
    background:#22c55e;
    border-radius:50%;
}

.shape-diamond{
    background:#f59e0b;

    transform:rotate(45deg);
}

.shape-triangle{
    width:0!important;
    height:0!important;

    border-left:70px solid transparent;
    border-right:70px solid transparent;
    border-bottom:120px solid #ef4444;

    background:transparent;
}

.shape-star{
    background:#f59e0b;

    clip-path:
        polygon(
            50% 0%,
            61% 35%,
            98% 35%,
            68% 57%,
            79% 93%,
            50% 72%,
            21% 93%,
            32% 57%,
            2% 35%,
            39% 35%
        );
}

.shape-arrow{
    background:#3b82f6;

    clip-path:
        polygon(
            0 35%,
            65% 35%,
            65% 10%,
            100% 50%,
            65% 90%,
            65% 65%,
            0 65%
        );
}

.shape-line{
    height:4px!important;

    background:#172033;

    border-radius:10px;
}


/* TEXT BOX */

.textbox-object{
    display:flex;
    align-items:center;

    padding:8px;

    background:rgba(255,255,255,.7);

    border:1px dashed #64748b;

    color:#172033;

    font-size:14px;
}


/* STUDY CARD */

.study-card-object{
    padding:13px;

    border-radius:10px;

    background:#eef2ff;

    border-left:5px solid #6366f1;

    color:#172033;

    overflow:auto;
}

.study-card-object strong{
    display:block;
    margin-bottom:5px;
}


/* VIDEO */

.video-object{
    background:#020617;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
}

.video-object iframe{
    width:100%;
    height:100%;

    border:0;

    pointer-events:none;
}


/* =========================================================
   OBJECT HANDLES
========================================================= */

.resize-handle{
    position:absolute;

    width:9px;
    height:9px;

    background:white;

    border:2px solid #6366f1;

    border-radius:3px;

    z-index:10;
}

.resize-nw{
    left:-6px;
    top:-6px;

    cursor:nwse-resize;
}

.resize-ne{
    right:-6px;
    top:-6px;

    cursor:nesw-resize;
}

.resize-sw{
    left:-6px;
    bottom:-6px;

    cursor:nesw-resize;
}

.resize-se{
    right:-6px;
    bottom:-6px;

    cursor:nwse-resize;
}

.rotate-handle{
    position:absolute;

    left:50%;
    top:-30px;

    width:13px;
    height:13px;

    transform:translateX(-50%);

    border-radius:50%;

    background:#6366f1;

    border:2px solid white;

    cursor:grab;
}

.rotate-line{
    position:absolute;

    left:50%;
    top:-18px;

    width:1px;
    height:18px;

    background:#6366f1;

    transform:translateX(-50%);
}


/* =========================================================
   BOTTOM BAR
========================================================= */

.statusbar{
    height:31px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:#0b1220;

    border-top:1px solid var(--border);

    color:#64748b;

    font-size:8px;

    z-index:300;
}

.status-left,
.status-right{
    display:flex;
    align-items:center;
    gap:13px;
}

.status-control{
    display:flex;
    align-items:center;
    gap:5px;
}

.zoom-btn{
    width:22px;
    height:20px;

    border:0;

    border-radius:4px;

    background:transparent;

    color:#94a3b8;
}

.zoom-btn:hover{
    background:rgba(255,255,255,.06);
    color:white;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;

    z-index:3000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(2,6,23,.75);

    backdrop-filter:blur(8px);
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:min(100%,540px);
    max-height:90vh;

    overflow:auto;

    padding:22px;

    border-radius:16px;

    background:#0d1426;

    border:1px solid var(--border2);

    box-shadow:var(--shadow);
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
}

.modal-title{
    font-size:15px;
    font-weight:800;
}

.close-btn{
    width:30px;
    height:30px;

    border:0;
    border-radius:7px;

    background:rgba(255,255,255,.05);

    color:#94a3b8;

    font-size:17px;
}

.form-group{
    margin-bottom:14px;
}

.form-label{
    display:block;

    margin-bottom:6px;

    color:#cbd5e1;

    font-size:9px;
    font-weight:700;
}

.form-input,
.form-select,
.form-textarea{
    width:100%;

    border:1px solid var(--border);

    border-radius:8px;

    outline:none;

    background:#080e1b;

    color:white;

    font-size:10px;
}

.form-input,
.form-select{
    height:38px;

    padding:0 10px;
}

.form-textarea{
    min-height:110px;

    resize:vertical;

    padding:10px;

    line-height:1.5;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
    border-color:#6366f1;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;

    gap:7px;

    margin-top:18px;
}

.modal-btn{
    height:36px;

    padding:0 14px;

    border-radius:7px;

    border:1px solid var(--border);

    background:rgba(255,255,255,.04);

    color:#cbd5e1;

    font-size:9px;
}

.modal-btn.primary{
    border:0;

    background:
        linear-gradient(
            100deg,
            #4f46e5,
            #7c3aed
        );

    color:white;
}


/* =========================================================
   INSERT MENU
========================================================= */

.insert-menu{
    position:fixed;

    min-width:190px;

    display:none;

    padding:6px;

    z-index:2500;

    border:1px solid var(--border2);

    border-radius:10px;

    background:#0d1426;

    box-shadow:var(--shadow);
}

.insert-menu.show{
    display:block;
}

.insert-item{
    width:100%;

    display:flex;
    align-items:center;

    gap:9px;

    padding:8px;

    border:0;
    border-radius:6px;

    background:transparent;

    color:#cbd5e1;

    text-align:left;

    font-size:9px;
}

.insert-item:hover{
    background:rgba(99,102,241,.1);
    color:white;
}

.insert-icon{
    width:22px;
    height:22px;

    display:grid;
    place-items:center;

    border-radius:5px;

    background:rgba(255,255,255,.05);
}


/* =========================================================
   TOAST
========================================================= */

.toast-container{
    position:fixed;

    right:18px;
    bottom:45px;

    z-index:5000;

    display:flex;
    flex-direction:column;

    gap:7px;
}

.toast{
    min-width:240px;

    padding:11px 13px;

    border-radius:9px;

    background:#111827;

    border:1px solid var(--border2);

    box-shadow:var(--shadow);

    color:#e2e8f0;

    font-size:9px;

    animation:toastIn .2s ease;
}

.toast.success{
    border-left:3px solid var(--green);
}

.toast.error{
    border-left:3px solid var(--red);
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   FIND BAR
========================================================= */

.findbar{
    position:absolute;

    top:8px;
    right:15px;

    z-index:1200;

<script>
/* =========================================================
   STORAGE
========================================================= */

const USERS_KEY = "nimcet_preppro_users";
const SESSION_KEY = "nimcet_preppro_session";


function getUsers(){

    try{
        return JSON.parse(
            localStorage.getItem(USERS_KEY)
        ) || [];
    }catch{
        return [];
    }
}


function saveUsers(users){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );
}


/* =========================================================
   SESSION
========================================================= */

let session = null;

try{
    session = JSON.parse(
        localStorage.getItem(SESSION_KEY)
    );
}catch{
    session = null;
}


/*
   Login system ke saath compatible.
*/

if(!session){

    window.location.href = "index.html";

}


let users = getUsers();

let user = users.find(
    u => u.id === session?.userId
);


if(!user){

    localStorage.removeItem(
        SESSION_KEY
    );

    window.location.href = "index.html";

}


/* =========================================================
   URL CONTEXT
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const lectureId =
    params.get("lectureId") ||
    params.get("lecture") ||
    "";

const noteId =
    params.get("noteId") ||
    params.get("note") ||
    "";


/* =========================================================
   USER DATA
========================================================= */

if(!Array.isArray(user.notes)){
    user.notes = [];
}

// Find the lecture inside the real Subject > Chapter > Lecture tree.
let currentLecture = null;
let currentChapter = null;
let currentSubject = null;

if(lectureId && Array.isArray(user.studyNotes?.subjects)){
    outer:
    for(const subject of user.studyNotes.subjects){
        for(const chapter of (subject.chapters || [])){
            const lecture = (chapter.lectures || []).find(
                l => l.id === lectureId
            );
            if(lecture){
                currentSubject = subject;
                currentChapter = chapter;
                currentLecture = lecture;
                break outer;
            }
        }
    }
}

/* =========================================================
   CURRENT NOTE
========================================================= */

let currentNote = null;

// 1. Exact noteId from notes.html
if(noteId){
    currentNote = user.notes.find(
        n => n.id === noteId
    ) || null;
}

// 2. If no noteId was supplied, use the note linked to this lecture.
if(!currentNote && currentLecture?.noteId){
    currentNote = user.notes.find(
        n => n.id === currentLecture.noteId
    ) || null;
}

// 3. Migration fallback for notes created before this fix.
if(!currentNote && lectureId){
    currentNote = user.notes.find(
        n => n.lectureId === lectureId
    ) || null;
}

// 4. Create the note only when absolutely necessary.
if(!currentNote){
    currentNote = {
        id: "note_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8),
        lectureId: lectureId || "",
        subjectId: currentSubject?.id || params.get("subject") || "",
        chapterId: currentChapter?.id || params.get("chapter") || "",
        title: currentLecture?.name || "Untitled Note",
        content: "",
        objects: [],
        important: !!currentLecture?.important,
        pinned: !!currentLecture?.pinned,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
    };
    user.notes.unshift(currentNote);
}

// Keep the lecture -> note relationship permanently synchronized.
if(currentLecture){
    currentLecture.noteId = currentNote.id;
    currentNote.lectureId = currentLecture.id;
    currentNote.subjectId = currentSubject?.id || currentNote.subjectId || "";
    currentNote.chapterId = currentChapter?.id || currentNote.chapterId || "";
}


/* =========================================================
   ELEMENTS
========================================================= */

const editor =
    document.getElementById(
        "editor"
    );

const objectLayer =
    document.getElementById(
        "objectLayer"
    );

const page =
    document.getElementById(
        "page"
    );

const canvasArea =
    document.getElementById(
        "canvasArea"
    );

const sidebar =
    document.getElementById(
        "sidebar"
    );

const saveStatus =
    document.getElementById(
        "saveStatus"
    );

const saveText =
    document.getElementById(
        "saveText"
    );

const noteName =
    document.getElementById(
        "noteName"
    );

const modalOverlay =
    document.getElementById(
        "modalOverlay"
    );

const modalBody =
    document.getElementById(
        "modalBody"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const insertMenu =
    document.getElementById(
        "insertMenu"
    );


/* =========================================================
   SAVE
========================================================= */

let saveTimer = null;

function saveCurrentUser(){
    const index = users.findIndex(
        u => u.id === user.id
    );

    if(index === -1){
        throw new Error("Current user was not found.");
    }

    users[index] = user;

    const payload = JSON.stringify(users);
    localStorage.setItem(USERS_KEY, payload);

    // Verify that the browser actually accepted the data.
    const saved = localStorage.getItem(USERS_KEY);
    if(saved !== payload){
        throw new Error("Browser storage verification failed.");
    }
}


function saveNote(){
    try{
        currentNote.title =
            noteName.value.trim() ||
            (currentLecture?.name || "Untitled Note");

        currentNote.content = editor.innerHTML;
        currentNote.objects = getObjectsFromDOM();
        currentNote.updatedAt = new Date().toISOString();

        if(currentLecture){
            currentLecture.noteId = currentNote.id;
            currentLecture.updatedAt = new Date().toISOString();
            currentLecture.important = !!currentNote.important;
            currentLecture.pinned = !!currentNote.pinned;
        }

        saveCurrentUser();
        setSaveState("saved");
        return true;
    }catch(error){
        console.error("Note save failed:", error);
        setSaveState("error");
        showToast("Note save failed. Browser storage may be full.", "error");
        return false;
    }
}


function autoSave(){

    setSaveState("saving");

    clearTimeout(saveTimer);

    saveTimer =
        setTimeout(

function getYouTubeId(url){

    try{

        const u =
            new URL(url);

        if(
            u.hostname.includes(
                "youtu.be"
            )
        ){
            return u.pathname.slice(1);
        }

        if(
            u.hostname.includes(
                "youtube.com"
            )
        ){
            return u.searchParams.get(
                "v"
            );
        }

    }catch{}

    return null;

}

/* =========================================================
   OBJECT ID
========================================================= */

function generateId(prefix="obj"){

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2,8)
    );

}


/* =========================================================
   RENDER OBJECT
========================================================= */

function renderObject(obj){

    const old =
        document.getElementById(
            obj.id
        );

    if(old)
        old.remove();


    const el =
        document.createElement(
            "div"
        );


    el.id =
        obj.id;

    el.className =
        "editor-object";


    el.dataset.id =
        obj.id;


    el.style.left =
        obj.x + "px";

    el.style.top =
        obj.y + "px";

    el.style.width =
        obj.width + "px";

    el.style.height =
        obj.height + "px";

    el.style.transform =
        `rotate(${obj.rotation || 0}deg)`;


    /* IMAGE */

    if(obj.type === "image"){

        el.classList.add(
            "image-object"
        );

        el.innerHTML = `

            <div class="object-content">

                <img
                    src="${escapeHTML(obj.src)}"
                    draggable="false"
                >

            </div>

        `;

    }


    /* SHAPE */

    else if(obj.type === "shape"){

        el.classList.add(
            "shape-object",
            "shape-" + obj.shape
        );

        el.style.background =
            obj.shape === "triangle" ||
            obj.shape === "star" ||
            obj.shape === "arrow"
            ? obj.color
            : obj.color;

        el.innerHTML =
            `
            <div class="object-content">
                ${escapeHTML(obj.text || "")}
            </div>
            `;

    }


    /* TEXT BOX */

    else if(obj.type === "textbox"){

        el.classList.add(
            "textbox-object"
        );

        el.innerHTML =
            `
            <div
                class="object-content"
                contenteditable="true"
            >
                ${escapeHTML(
                    obj.text ||
                    "Type your text here"
                )}
            </div>
            `;

        const content =
            el.querySelector(
                ".object-content"
            );

        content.addEventListener(
            "input",
            () => {

                obj.text =
                    content.innerText;

                autoSave();

            }
        );

    }


    /* VIDEO */

    else if(obj.type === "video"){

        el.classList.add(
            "video-object"
        );

        el.innerHTML =
            `
            <div class="object-content">

                <iframe
                    src="https://www.youtube.com/embed/${escapeHTML(obj.videoId)}"
                    allowfullscreen
                ></iframe>

            </div>
            `;

    }


    /* STUDY */

    else if(obj.type === "study"){

        el.classList.add(
            "study-card-object"
        );

        const icon =
            {
                formula:"📐",
                important:"⭐",
                tip:"💡",
                warning:"⚠",
                example:"🧠",
                doubt:"❓"
            }[
                obj.studyType
            ] || "💡";


        el.innerHTML =
            `
            <div class="object-content">

                <strong>
                    ${icon}
                    ${escapeHTML(
                        obj.heading
                    )}
                </strong>

                <div>
                    ${escapeHTML(
                        obj.content
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}
                </div>

            </div>
            `;

    }


    addHandles(el);

    addObjectEvents(
        el,
        obj
    );

    objectLayer.appendChild(
        el
    );

}


/* =========================================================
   HANDLES
========================================================= */

function addHandles(el){

    [
        "nw",
        "ne",
        "sw",
        "se"
    ].forEach(
        pos => {

            const handle =
                document.createElement(
                    "div"
                );

            handle.className =
                "resize-handle resize-" +
                pos;

            handle.dataset.resize =
                pos;

            el.appendChild(
                handle
            );

        }
    );


    const line =
        document.createElement(
            "div"
        );

    line.className =
        "rotate-line";

    el.appendChild(
        line
    );


    const rotate =
        document.createElement(
            "div"
        );

    rotate.className =
        "rotate-handle";

    rotate.dataset.rotate =
        "true";

    el.appendChild(
        rotate
    );

}


/* =========================================================
   OBJECT INTERACTION
========================================================= */

let selectedObjectId = null;

let interaction = null;


function addObjectEvents(
    el,
    obj
){

    el.addEventListener(
        "pointerdown",
        event => {

            if(
                event.target.dataset.resize
            ){

                startResize(
                    event,
                    el,
                    obj
                );

                return;

            }


            if(
                event.target.dataset.rotate
            ){

                startRotate(
                    event,
                    el,
                    obj
                );

                return;

            }


            if(
                event.target.closest(
                    "[contenteditable]"
                )
            ){

                return;

            }


            event.preventDefault();

            selectObject(
                obj.id
            );

            startMove(
                event,
                el,
                obj
            );

        }
    );


    el.addEventListener(
        "dblclick",
        () => {

            if(
                obj.type === "image"
            ){

                openImageReplace(
                    obj
                );

            }

            if(
                obj.type === "shape"
            ){

                openShapeEdit(
                    obj
                );

            }

        }
    );

}

/* =========================================================
   MOVE
========================================================= */

function startMove(
    event,
    el,
    obj
){

    const startX =
        event.clientX;

    const startY =
        event.clientY;

    const originalX =
        obj.x;

    const originalY =
        obj.y;


    interaction = {

        type:
            "move",

        move: (

            e
        ) => {

            const dx =
                e.clientX -
                startX;

            const dy =
                e.clientY -
                startY;


            obj.x =
                Math.max(
                    0,
                    originalX + dx
                );

            obj.y =
                Math.max(
                    0,
                    originalY + dy
                );


            applyObjectPosition(
                el,
                obj
            );

        },

        end: () => {

            interaction =
                null;

            autoSave();

        }

    };


    window.addEventListener(
        "pointermove",
        interaction.move
    );

    window.addEventListener(
        "pointerup",
        endInteraction,
        {
            once:true
        }
    );

}


/* =========================================================
   RESIZE
========================================================= */

function startResize(
    event,
    el,
    obj
){

    event.preventDefault();

    const corner =
        event.target.dataset.resize;

    const startX =
        event.clientX;

    const startY =
        event.clientY;

    const startWidth =
        obj.width;

    const startHeight =
        obj.height;

    const startLeft =
        obj.x;

    const startTop =
        obj.y;


    interaction = {

        type:
            "resize",

        move: e => {

            const dx =
                e.clientX -
                startX;

            const dy =
                e.clientY -
                startY;


            let width =
                startWidth;

            let height =
                startHeight;

            let left =
                startLeft;

            let top =
                startTop;


            if(
                corner.includes("e")
            ){

                width =
                    startWidth + dx;

            }

            if(
                corner.includes("s")
            ){

                height =
                    startHeight + dy;

            }

            if(
                corner.includes("w")
            ){

                width =
                    startWidth - dx;

                left =
                    startLeft + dx;

            }

            if(
                corner.includes("n")
            ){

                height =
                    startHeight - dy;

                top =
                    startTop + dy;

            }


            width =
                Math.max(
                    30,
                    width
                );

            height =
                Math.max(
                    20,
                    height
                );


            obj.width =
                width;

            obj.height =
                height;

            obj.x =
                Math.max(
                    0,
                    left
                );

            obj.y =
                Math.max(
                    0,
                    top
                );


            applyObjectPosition(
                el,
                obj
            );

        },

        end: () => {

            interaction =
                null;

            autoSave();

        }

    };


    window.addEventListener(
        "pointermove",
        interaction.move
    );

    window.addEventListener(
        "pointerup",
        endInteraction,
        {
            once:true
        }
    );

}


/* =========================================================
   ROTATE
========================================================= */

function startRotate(
    event,
    el,
    obj
){

    event.preventDefault();

    const rect =
        el.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    interaction = {

        type:
            "rotate",

        move: e => {

            const angle =
                Math.atan2(
                    e.clientY -
                    centerY,
                    e.clientX -
                    centerX
                ) *
                180 /
                Math.PI;


            obj.rotation =
                angle + 90;


            applyObjectPosition(
                el,
                obj
            );

        },

        end: () => {

            interaction =
                null;

            autoSave();

        }

    };


    window.addEventListener(
        "pointermove",
        interaction.move
    );

    window.addEventListener(
        "pointerup",
        endInteraction,
        {
            once:true
        }
    );

}


function endInteraction(){

    if(
        interaction &&
        interaction.move
    ){

        window.removeEventListener(
            "pointermove",
            interaction.move
        );

    }

    if(
        interaction &&
        interaction.end
    ){

        interaction.end();

    }

}


/* =========================================================
   APPLY POSITION
========================================================= */

function applyObjectPosition(
    el,
    obj
){

    el.style.left =
        obj.x + "px";

    el.style.top =
        obj.y + "px";

    el.style.width =
        obj.width + "px";

    el.style.height =
        obj.height + "px";

    el.style.transform =
        `rotate(${obj.rotation || 0}deg)`;

}


/* =========================================================
   KEYBOARD OBJECT CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            !selectedObjectId
        )
            return;

        const obj =
            currentNote.objects.find(
                o =>
                    o.id ===
                    selectedObjectId
            );

        if(!obj)
            return;


        const tag =
            document.activeElement?.tagName;


        if(
            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            document.activeElement?.isContentEditable
        ){

            return;

        }


        const step =
            event.shiftKey
                ? 10
                : 2;


        let changed =
            false;


        if(event.key === "ArrowLeft"){

            obj.x =
                Math.max(
                    0,
                    obj.x - step
                );

            changed = true;

        }

        if(event.key === "ArrowRight"){

            obj.x += step;

            changed = true;

        }

        if(event.key === "ArrowUp"){

            obj.y =
                Math.max(
                    0,
                    obj.y - step
                );

            changed = true;

        }

        if(event.key === "ArrowDown"){

            obj.y += step;

            changed = true;

        }


        if(event.key === "Delete"){

            deleteSelectedObject();

            event.preventDefault();

            return;

        }


        if(changed){

            event.preventDefault();

            const el =
                document.getElementById(
                    obj.id
                );

            if(el){

                applyObjectPosition(
                    el,
                    obj
                );

            }

            autoSave();

        }

    }
);


/* =========================================================
   COPY / DUPLICATE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            !selectedObjectId
        )
            return;


        if(
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "d"
        ){

            const obj =
                currentNote.objects.find(
                    o =>
                        o.id ===
                        selectedObjectId
                );

            if(!obj)
                return;


            const copy =
                JSON.parse(
                    JSON.stringify(obj)
                );

            copy.id =
                generateId(
                    obj.type
                );

            copy.x += 25;
            copy.y += 25;


            currentNote.objects.push(
                copy
            );

            renderObject(
                copy
            );

            selectObject(
                copy.id
            );

            autoSave();

            event.preventDefault();

        }

    }
);


/* =========================================================
   DELETE OBJECT
========================================================= */

function deleteSelectedObject(){

    if(
        !selectedObjectId
    )
        return;


    currentNote.objects =
        currentNote.objects.filter(
            o =>
                o.id !==
                selectedObjectId
        );


    const el =
        document.getElementById(
            selectedObjectId
        );

    if(el)
        el.remove();


    selectedObjectId =
        null;


    document.getElementById(
        "statusSelection"
    ).textContent =
        "No object selected";


    updateStats();

    autoSave();

}

    .getElementById(
        "replaceAll"
    )
    .addEventListener(
        "click",
        () => {

            const find =
                document
                    .getElementById(
                        "findInput"
                    )
                    .value;

            const replace =
                document
                    .getElementById(
                        "replaceInput"
                    )
                    .value;


            if(!find)
                return;


            const walker =
                document.createTreeWalker(
                    editor,
                    NodeFilter.SHOW_TEXT
                );


            const nodes = [];

            while(
                walker.nextNode()
            ){

                nodes.push(
                    walker.currentNode
                );

            }


            nodes.forEach(
                node => {

                    node.nodeValue =
                        node.nodeValue.replaceAll(
                            find,
                            replace
                        );

                }
            );


            autoSave();

            updateStats();

            showToast(
                "Replace completed."
            );

        }
    );

        );


    if(!headings.length){

                style="color:#64748b;"

        return;

    outline.innerHTML =
        Array.from(
            headings
        )
        .map(
            (heading,index) => {

                heading.id =
                    heading.id ||
                    "heading_" +
                    index;

                return `
                <div
                    class="
                        outline-item
                        ${heading.tagName.toLowerCase()}
                    "
                    data-target="${heading.id}"
                >
                    ${escapeHTML(
                        heading.innerText ||
                        "Untitled heading"
                    )}
                </div>

        )
        .join("");


    outline
        .querySelectorAll(
            "[data-target]"

        .forEach(
            item => {

                    "click",

                        if(target){

                            target.scrollIntoView({

/* =========================================================

========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   INITIAL SAVE
========================================================= */

saveCurrentUser();

setSaveState(
    "saved"
);


/* =========================================================
   AUTO SAVE BEFORE LEAVING
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        saveNote();

    }
);


/* =========================================================
   MOBILE SIDEBAR INITIAL STATE
========================================================= */

if(
    window.innerWidth <= 700
){

    sidebar.classList.add(
        "collapsed"
    );

}


/* =========================================================
   INITIAL OUTLINE / STATS
========================================================= */

updateStats();
updateOutline();


/* =========================================================
   WELCOME
========================================================= */

if(
    !currentNote.content &&
    currentNote.objects.length === 0
){

    editor.innerHTML =
        `
        <h1>
            ${escapeHTML(
                currentNote.title
            )}
        </h1>

        <p>
            Start creating your NIMCET study notes here.
            You can add formulas, concepts, images,
            shapes, tables and study blocks.
        </p>

        <h2>
            Quick Study Notes
        </h2>

        <p>
            Use the toolbar above to format your notes.
            Insert images and shapes from
            <b>＋ Insert</b>.
        </p>
        `;

    autoSave();

}

</script>

</body>
</html>
